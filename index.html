<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#1f2d47;--mute:#70809b;--pri:#3a5c9e;--ok:#2f9e6e;--warn:#cf8a22;--bad:#cf4a52;--gl:rgba(255,255,255,.5);--gb:rgba(255,255,255,.75);--ln:rgba(60,90,140,.13);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-size:14px;background:#e8eef8}button,input,select,textarea{font:inherit;color:inherit}
body:before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,#cfe0fb,transparent),radial-gradient(35% 35% at 85% 20%,#f3e0ee,transparent),radial-gradient(40% 40% at 70% 92%,#d5efe6,transparent),linear-gradient(160deg,#eaf0fa,#f5f1f8)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}@keyframes tp{from{background-position:-50% 0}to{background-position:150% 0}}@keyframes sh{to{background-position:-200% 0}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes pulse{50%{opacity:.75}}
.card,.side,.top,.lcard,.md{background:var(--gl);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--gb);box-shadow:0 14px 40px -22px rgba(40,70,120,.45),inset 0 1px 0 rgba(255,255,255,.9)}
#tp{position:fixed;top:0;left:0;width:100%;height:3px;z-index:120;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,transparent,var(--pri),#c0392b,transparent) no-repeat;background-size:45% 100%}#tp.on{opacity:1;animation:tp 1s linear infinite}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:linear-gradient(160deg,#eaf0fa,#f5f1f8);transition:opacity .4s}#splash p{margin:0;color:var(--mute);font-weight:600}
.rg{position:relative;width:128px;height:128px;display:grid;place-items:center}.rg img{width:58px}.rg svg{position:absolute;inset:0;animation:spin 1.7s linear infinite}.rg svg+svg{inset:12px;width:104px;height:104px;animation-duration:2.6s;animation-direction:reverse}
.bar{width:180px;height:3px;background:rgba(58,92,158,.15);border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pri),#c0392b);animation:sl 1.2s ease-in-out infinite}@keyframes sl{from{margin-left:-40%}to{margin-left:100%}}
#login{position:fixed;inset:0;display:grid;place-items:center}.lcard{width:min(400px,92vw);border-radius:28px;padding:32px;animation:pop .5s}.lcard h2{margin:14px 0 2px;font-size:20px;text-align:center}.lcard p{margin:0 0 16px;color:var(--mute);text-align:center}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px;color:#44546e}.in{width:100%;padding:10px 13px;border:1px solid var(--ln);border-radius:13px;background:rgba(255,255,255,.7);outline:0;transition:.2s}.in:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(58,92,158,.14);background:#fff}.in:disabled{background:rgba(255,255,255,.3);border-color:transparent;color:#40506a;opacity:1;-webkit-text-fill-color:#40506a}
.who{display:flex;align-items:center;gap:10px}.av{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,#3a5c9e,#8fb0e0);color:#fff;display:grid;place-items:center;font-weight:800;background-size:cover;background-position:center}
.btn{border:0;border-radius:13px;padding:9px 16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4a6fb3,#3a5c9e);box-shadow:0 8px 18px -10px #3a5c9e;transition:.2s;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.w{width:100%;margin-top:18px;padding:12px}.btn.g{background:rgba(255,255,255,.65);color:var(--ink);border:1px solid var(--ln);box-shadow:none}.btn.ok{background:linear-gradient(135deg,#43b184,#2f9e6e)}.btn.bd{background:linear-gradient(135deg,#dd6a70,#cf4a52)}.btn.wr{background:linear-gradient(135deg,#e2a24a,#cf8a22)}.btn.sm{padding:6px 12px;font-size:12px;border-radius:11px}
.err{color:var(--bad);font-weight:600;min-height:18px;margin-top:10px;font-size:13px}.shake{animation:shake .4s}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;gap:12px;padding:12px}.side{border-radius:24px;overflow:auto;padding:14px 10px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:800;font-size:15px;line-height:1.15}.brand img{width:38px}.brand small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.nav h6{margin:14px 10px 5px;font-size:11px;color:var(--mute);font-weight:700}.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;cursor:pointer;font-weight:600;color:#3b4c68;transition:.15s;font-size:13px}.nav a i{font-style:normal;font-size:17px;width:22px;text-align:center}.nav a:hover{background:rgba(255,255,255,.6)}.nav a.on{background:rgba(255,255,255,.9);color:var(--pri);box-shadow:0 6px 16px -10px rgba(40,70,120,.5)}
.main{display:flex;flex-direction:column;min-width:0;gap:12px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:20px}.top h3{margin:0;font-size:17px}.sp{flex:1}.chip{display:flex;align-items:center;gap:9px;padding:3px 12px 3px 3px;border:1px solid var(--ln);border-radius:30px;font-weight:600;font-size:12px;background:rgba(255,255,255,.5)}.chip .av{width:30px;height:30px;font-size:12px}
.hb{display:none}.page{flex:1;overflow:auto;padding:2px 4px 8px}.emg{display:none;background:linear-gradient(90deg,#dd6a70,#c0392b);color:#fff;padding:9px 18px;border-radius:16px;font-weight:700;animation:pulse 1.4s infinite}
.card{border-radius:22px;padding:18px;overflow:hidden}.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:14px 0}.kpi{display:flex;gap:12px;align-items:center;cursor:pointer;transition:.2s}.kpi:hover{transform:translateY(-3px)}.kpi i{font-style:normal;font-size:28px}.kpi b{font-size:24px;display:block;line-height:1}.kpi span{color:var(--mute);font-size:12px;font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.bars{display:flex;align-items:flex-end;gap:9px;height:130px;margin-top:12px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mute);height:100%;display:flex;flex-direction:column;justify-content:flex-end}.bars i{display:block;border-radius:8px 8px 0 0;transform-origin:bottom;animation:grow .6s backwards;min-height:3px;opacity:.85}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.tb .in{width:auto;padding:8px 11px}.tb .q{flex:1;min-width:160px}.cnt{margin-top:8px;color:var(--mute);font-weight:600;font-size:12px}
.tw{overflow:auto;max-height:calc(100vh - 215px)}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:rgba(240,245,252,.92);text-align:left;padding:10px 12px;font-size:12px;color:#4a5b75;white-space:nowrap;z-index:1}td{padding:9px 12px;border-top:1px solid var(--ln);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}tbody tr{cursor:pointer;transition:.12s}tbody tr:hover{background:rgba(255,255,255,.75)}th s{text-decoration:none;color:var(--warn);margin-left:3px}
.bg{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:11px}.b1{background:#e3ecfb;color:#2d4f8f}.b2{background:#dcf3e8;color:#1f7a53}.b3{background:#fbefd6;color:#9a6512}.b4{background:#fbe3e4;color:#a8343b}.b0{background:#eceff5;color:#51607a}
.empty{text-align:center;padding:46px;color:var(--mute)}.empty big{font-size:40px;display:block}.sk{height:16px;margin:14px 0;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.9),rgba(255,255,255,.3)) 0 0/200% 100%;animation:sh 1.3s linear infinite}
.ov{position:fixed;inset:0;z-index:60;background:rgba(40,55,85,.35);backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px;animation:pop .2s}.md{background:rgba(255,255,255,.8);border-radius:26px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:22px}.md h3{margin:0 0 12px;display:flex;align-items:center;gap:10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fg .full{grid-column:1/-1}.ht{font-size:11px;color:var(--mute);margin-top:3px}.tg{font-weight:600;font-size:10px;padding:1px 7px;border-radius:9px;margin-left:5px;background:#fbefd6;color:#9a6512}.tg.k{background:#e3ecfb;color:#2d4f8f}.fl{font-size:12px;font-weight:600;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv span{color:var(--mute)}

 const head=()=>{d.addImage(LOGO,'PNG',14,8,lw,lw/LR);d.setTextColor(31,45,71);d.setFont(undefined,'bold');d.setFontSize(13);d.text(m[0],14+lw+6,13);d.setFontSize(11);d.text(m[1],14+lw+6,19);d.setFont(undefined,'normal');d.setFontSize(8.5);d.text(m[2]+'   |   '+m[3],14+lw+6,24.5);d.setDrawColor(58,92,158);d.setLineWidth(.6);d.line(14,29,W-14,29)};
 d.autoTable({startY:33,margin:{top:33,left:14,right:14},head:[r.cols],body:r.rows.map(x=>r.cols.map(c=>cellTxt(r,c,x[c]))),styles:{fontSize:7.5,cellPadding:1.6},headStyles:{fillColor:[58,92,158]},alternateRowStyles:{fillColor:[245,247,252]},didDrawPage:()=>{head();d.setFontSize(8);d.setTextColor(110,120,140);d.text('Hal. '+d.internal.getNumberOfPages(),W-14,H-6,{align:'right'})}});
 let y=d.lastAutoTable.finalY+8;if(y>H-45){d.addPage();head();y=38}d.setTextColor(31,45,71);d.setFontSize(9);d.text(m[4],14,y);d.text('Dibuat oleh,',W-95,y+8);d.text('Mengetahui,',W-48,y+8);d.text(S.user.nama,W-95,y+28);d.text('Kepala Security',W-48,y+28);d.save(fname(r,'pdf'))}catch(e){toast('Gagal membuat PDF. Gunakan Print > Simpan sebagai PDF.','e')}busy(-1)}
function toPrint(r){const m=meta(r),w=window.open('','_blank');if(!w)return toast('Izinkan pop-up untuk mencetak','e');
 w.document.write(`<html><head><title>${esc(r.title)}</title><style>body{font:11px Arial;margin:18px;color:#1f2d47}.k{display:flex;align-items:center;gap:16px;border-bottom:3px solid #3a5c9e;padding-bottom:8px;margin-bottom:10px}.k img{height:50px}h1{margin:0;font-size:17px}h2{margin:2px 0 4px;font-size:13px}table{width:100%;border-collapse:collapse}th{background:#3a5c9e;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}th,td{border:1px solid #aab4c8;padding:4px 6px;text-align:left}thead{display:table-header-group}tr:nth-child(even) td{background:#f4f6fb;-webkit-print-color-adjust:exact}.s{display:flex;justify-content:space-around;margin-top:30px;text-align:center}@page{size:A4 landscape;margin:10mm}</style></head><body><div class="k"><img src="${LOGO}"><div><h1>${esc(m[0])}</h1><h2>${esc(m[1])}</h2>${esc(m[2])} &nbsp;|&nbsp; ${esc(m[3])}</div></div><table><thead><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(x=>`<tr>${r.cols.map(c=>`<td>${esc(cellTxt(r,c,x[c]))}</td>`).join('')}</tr>`).join('')}</tbody></table><p><b>${esc(m[4])}</b></p><div class="s"><div>Dibuat oleh,<br><br><br><br>${esc(S.user.nama)}</div><div>Mengetahui,<br><br><br><br>Kepala Security</div></div></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),500)}
boot();
</script></body></html>
